services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.uvicorn
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - FROST_CLIENT_ID=${FROST_CLIENT_ID}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
 
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy